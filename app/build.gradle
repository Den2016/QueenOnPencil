plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
}

def userHome = System.getProperty("user.home")
def keystoreFile = new File(userHome, ".android-keys/queenonpencil.jks")

def keystorePropertiesFile = rootProject.file("local.properties")
def keystoreProperties = new Properties()
keystoreProperties.load(new FileInputStream(keystorePropertiesFile))



android {
    namespace 'com.beequeencalendar'
    compileSdk 34

    defaultConfig {
        applicationId "com.beequeencalendar"
        minSdk 23
        targetSdk 34
        versionCode 7
        versionName "2.7"
    }

    signingConfigs {
        release {
            // Проверяем, существует ли файл, чтобы сборка не падала с непонятной ошибкой
            if (keystoreFile.exists()) {
                storeFile = keystoreFile
                storePassword = keystoreProperties['STORE_PASSWORD']
                keyAlias = keystoreProperties['KEY_ALIAS']
                keyPassword = keystoreProperties['KEY_PASSWORD']
            }
        }

    }


    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Подвязываем подпись, если файл существует
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            // Чтобы дебаг подписался релизным ключом:
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        // Включаем десугаринг для java.time
        // ✅ Правильный синтаксис для Groovy:
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "BeeQueenCalendar-${variant.versionName}.apk"
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Navigation
    implementation 'androidx.navigation:navigation-fragment-ktx:2.7.7'
    implementation 'androidx.navigation:navigation-ui-ktx:2.7.7'

    // Room
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'

    // Lifecycle
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'

    // Добавляем библиотеку десугаринга
    // ✅ Добавляем библиотеку десугаринга (в самом низлу файла):
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}
